[project]
name = "ari-os"
version = "2.0.0"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial License 1.0.0" }
classifiers = [
    "License :: Other/Proprietary License",
]
dependencies = [
    "sqlite-vec>=0.1.6",
    "scikit-learn>=1.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
    "mcp>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
media = [
    "youtube-transcript-api>=0.6",
    "pillow>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
